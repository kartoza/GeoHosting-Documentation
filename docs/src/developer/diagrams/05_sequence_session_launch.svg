<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <title>Sequence — Launch QGIS Cloud Desktop session</title>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2D3A3B"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#CC0403"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#569FC6"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#06969A"/>
  </marker>
  <marker id="diamond" viewBox="0 0 12 12" refX="11" refY="6"
          markerWidth="12" markerHeight="12" orient="auto">
    <path d="M0,6 L6,0 L12,6 L6,12 z"
          fill="#FFFFFF" stroke="#2D3A3B" stroke-width="1"/>
  </marker>
  <marker id="diamond-filled" viewBox="0 0 12 12" refX="11" refY="6"
          markerWidth="12" markerHeight="12" orient="auto">
    <path d="M0,6 L6,0 L12,6 L6,12 z"
          fill="#2D3A3B" stroke="#2D3A3B" stroke-width="1"/>
  </marker>
  <marker id="triangle-open" viewBox="0 0 12 12" refX="11" refY="6"
          markerWidth="12" markerHeight="12" orient="auto">
    <path d="M0,0 L12,6 L0,12 z"
          fill="#FFFFFF" stroke="#2D3A3B" stroke-width="1"/>
  </marker>
</defs>

  <rect x="0" y="0" width="1500" height="1000" fill="#FFFFFF"/>
  <g id="title">
    <text x="750.0" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1F2A2B">Sequence — Launch QGIS Cloud Desktop session</text>
    <text x="750.0" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8A8B8B">FR-040 / FR-041 / FR-042 / FR-071 / FR-073</text>
  </g>
  <rect x="50" y="100" width="180" height="44" rx="6" ry="6" fill="#DCEAF2" stroke="#2D3A3B" stroke-width="1.4"/>
  <text x="140" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2A2B" style="">End User
(browser)</text>
  <line x1="140" y1="144" x2="140" y2="910" stroke="#8A8B8B" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="270" y="100" width="180" height="44" rx="6" ry="6" fill="#DCEAF2" stroke="#2D3A3B" stroke-width="1.4"/>
  <text x="360" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2A2B" style="">End User Portal</text>
  <line x1="360" y1="144" x2="360" y2="910" stroke="#8A8B8B" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="470" y="100" width="180" height="44" rx="6" ry="6" fill="#F8E5C4" stroke="#2D3A3B" stroke-width="1.4"/>
  <text x="560" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2A2B" style="">Identity</text>
  <line x1="560" y1="144" x2="560" y2="910" stroke="#8A8B8B" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="690" y="100" width="180" height="44" rx="6" ry="6" fill="#F8E5C4" stroke="#2D3A3B" stroke-width="1.4"/>
  <text x="780" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2A2B" style="">Provisioning</text>
  <line x1="780" y1="144" x2="780" y2="910" stroke="#8A8B8B" stroke-width="1" stroke-dasharray="4,4"/>
