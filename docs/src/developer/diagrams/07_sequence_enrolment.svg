<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900">
  <title>Sequence — End User enrolment</title>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2D3A3B"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#CC0403"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#569FC6"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#06969A"/>
  </marker>
  <marker id="diamond" viewBox="0 0 12 12" refX="11" refY="6"
          markerWidth="12" markerHeight="12" orient="auto">
    <path d="M0,6 L6,0 L12,6 L6,12 z"
          fill="#FFFFFF" stroke="#2D3A3B" stroke-width="1"/>
  </marker>
  <marker id="diamond-filled" viewBox="0 0 12 12" refX="11" refY="6"
          markerWidth="12" markerHeight="12" orient="auto">
    <path d="M0,6 L6,0 L12,6 L6,12 z"
          fill="#2D3A3B" stroke="#2D3A3B" stroke-width="1"/>
  </marker>
  <marker id="triangle-open" viewBox="0 0 12 12" refX="11" refY="6"
          markerWidth="12" markerHeight="12" orient="auto">
    <path d="M0,0 L12,6 L0,12 z"
          fill="#FFFFFF" stroke="#2D3A3B" stroke-width="1"/>
  </marker>
</defs>

  <rect x="0" y="0" width="1500" height="900" fill="#FFFFFF"/>
  <g id="title">
    <text x="750.0" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1F2A2B">Sequence — Org Owner enrols a new End User</text>
    <text x="750.0" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8A8B8B">FR-010 / FR-012 / FR-013 / FR-015</text>
  </g>
  <rect x="70" y="100" width="180" height="44" rx="6" ry="6" fill="#DCEAF2" stroke="#2D3A3B" stroke-width="1.4"/>
  <text x="160" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2A2B" style="">Org Owner
(browser)</text>
  <line x1="160" y1="144" x2="160" y2="810" stroke="#8A8B8B" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="290" y="100" width="180" height="44" rx="6" ry="6" fill="#DCEAF2" stroke="#2D3A3B" stroke-width="1.4"/>
  <text x="380" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2A2B" style="">GSH Web</text>
  <line x1="380" y1="144" x2="380" y2="810" stroke="#8A8B8B" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="530" y="100" width="180" height="44" rx="6" ry="6" fill="#F8E5C4" stroke="#2D3A3B" stroke-width="1.4"/>
  <text x="620" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2A2B" style="">Tenant API</text>
  <line x1="620" y1="144" x2="620" y2="810" stroke="#8A8B8B" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="770" y="100" width="180" height="44" rx="6" ry="6" fill="#EDEDED" stroke="#2D3A3B" stroke-width="1.4"/>
  <text x="860" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2A2B" style="">Email service</text>
  <line x1="860" y1="144" x2="860" y2="810" stroke="#8A8B8B" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="990" y="100" width="180" height="44" rx="6" ry="6" fill="#DCEAF2" stroke="#2D3A3B" stroke-width="1.4"/>
  <text x="1080" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2A2B" style="">End User
(new browser)</text>
  <line x1="1080" y1="144" x2="1080" y2="810" stroke="#8A8B8B" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="1190" y="100" width="180" height="44" rx="6" ry="6" fill="#DCEAF2" stroke="#2D3A3B" stroke-width="1.4"/>
  <text x="1280" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2A2B" style="">Authenticator</text>
  <line x1="1280" y1="144" x2="1280" y2="810" stroke="#8A8B8B" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="1340" y="100" width="180" height="44" rx="6" ry="6" fill="#C7E8E9" stroke="#2D3A3B" stroke-width="1.4"/>
  <text x="1430" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2A2B" style="">Operational DB</text>
  <line x1="1430" y1="144" x2="1430" y2="810" stroke="#8A8B8B" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="160" y1="180" x2="380" y2="180" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">open Organisation › Users › "Invite"</text>
  <line x1="380" y1="220" x2="620" y2="220" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500.0" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">POST /api/v1/end-users (email, display_name, tier)</text>
  <line x1="620" y1="250" x2="1430" y2="250" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1025.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">INSERT EndUser (is_active=False)</text>
  <line x1="620" y1="280" x2="1430" y2="280" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1025.0" y="274" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">INSERT EnrolmentToken (7-day, URL-safe)</text>
  <line x1="620" y1="310" x2="1430" y2="310" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1025.0" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">INSERT RoleGrant qgis-desktop {tier_code}</text>
  <line x1="620" y1="340" x2="380" y2="340" stroke="#2D3A3B" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="500.0" y="334" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">201 { enrolment_url }</text>
  <line x1="380" y1="380" x2="860" y2="380" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620.0" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">send enrolment email</text>
  <line x1="860" y1="410" x2="1080" y2="410" stroke="#569FC6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="970.0" y="404" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">email with one-time link</text>
  <line x1="1080" y1="460" x2="620" y2="460" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850.0" y="454" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">GET /enrol/&lt;token&gt; (browser opens link)</text>
  <line x1="620" y1="490" x2="1430" y2="490" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1025.0" y="484" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">lookup token (consumable, unexpired)</text>
  <line x1="620" y1="520" x2="1080" y2="520" stroke="#2D3A3B" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="850.0" y="514" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">render enrolment page</text>
  <line x1="1080" y1="560" x2="620" y2="560" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850.0" y="554" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">POST /api/v1/passkey-registrations/begin/  (token)</text>
  <line x1="620" y1="590" x2="1430" y2="590" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1025.0" y="584" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">stash webauthn_challenge on EnrolmentToken</text>
  <line x1="620" y1="620" x2="1080" y2="620" stroke="#2D3A3B" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="850.0" y="614" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">publicKey creation options</text>
  <line x1="1080" y1="660" x2="1280" y2="660" stroke="#569FC6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="1180.0" y="654" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">navigator.credentials.create(options)</text>
  <line x1="1280" y1="690" x2="1080" y2="690" stroke="#569FC6" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <text x="1180.0" y="684" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">attestation</text>
  <line x1="1080" y1="730" x2="620" y2="730" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850.0" y="724" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">POST /api/v1/passkey-registrations/complete/  (attestation)</text>
  <line x1="620" y1="760" x2="620" y2="760" stroke="#2D3A3B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620.0" y="754" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">webauthn.verify (attestation)</text>
  <line x1="620" y1="800" x2="1430" y2="800" stroke="#06969A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="1025.0" y="794" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">INSERT Passkey; mark token used; activate EndUser</text>
  <line x1="620" y1="830" x2="1080" y2="830" stroke="#06969A" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="850.0" y="824" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#1F2A2B" style="">200 enrolment complete</text>
  <text x="1480" y="886" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="400" fill="#8A8B8B" style="">EnrolmentToken: one-shot, 7-day expiry, URL-safe; activates EndUser only on success.</text>
</svg>
